name: Build Skyrim Upscaler

on:
  push:
    branches:
      - support-skyrim-1.7.104
      - audit-1.7.104-runtime-safety
      - fix-fsr2-jitter-init
      - debug-metalfx-input-region
      - probe-metalfx-drs-raster
      - probe-metalfx-render-regions-b15
      - fix-metalfx-gpu-input-b16
      - fix-skyrim-engine-drs-b17
      - experiment-metalfx-kmain-b18
      - experiment-metalfx-prepost-b19
      - metalfx-native-b20
      - metalfx-native-b21
      - metalfx-native-b22
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV

      - name: Configure vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (git -C "$env:VCPKG_ROOT" rev-parse HEAD).Trim()
          $config = Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName "default-registry" -NotePropertyValue @{
            kind = "builtin"
            baseline = $baseline
          } -Force
          $config | ConvertTo-Json -Depth 20 |
            Set-Content vcpkg-configuration.json -Encoding utf8

      - name: Download CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --depth 1 --branch ng https://github.com/alandtse/CommonLibSSE-NG.git CommonLibSSE-NG
          git -C CommonLibSSE-NG fetch --depth 1 origin 9955ae3b18dd0aedbebb58fa207a4b7180eb6d67
          git -C CommonLibSSE-NG checkout --detach 9955ae3b18dd0aedbebb58fa207a4b7180eb6d67
          git -C CommonLibSSE-NG submodule update --init --recursive --progress

      - name: Validate embedded HLSL (FXC)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter fxc.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $fxc) { throw "Windows SDK FXC not found" }
          $source = Get-Content src/NativeMetalFX.h -Raw
          $matches = [regex]::Matches($source, 'static constexpr char (vertex|prep|resolve)\[\]=R"HLSL\(([\s\S]*?)\)HLSL";')
          if ($matches.Count -ne 3) { throw "Expected three embedded shaders" }
          foreach ($shader in $matches) {
            $name = $shader.Groups[1].Value
            $file = Join-Path $env:RUNNER_TEMP "$name.hlsl"
            [IO.File]::WriteAllText($file,$shader.Groups[2].Value)
            $target = if ($name -eq 'vertex') { 'vs_5_0' } else { 'ps_5_0' }
            & $fxc.FullName /nologo /T $target /E main /Fo "$file.cso" $file
            if ($LASTEXITCODE -ne 0) { throw "FXC failed for $name" }
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset skyrim `
            "-DUPSCALER_COMMONLIB_SOURCE=$env:GITHUB_WORKSPACE/CommonLibSSE-NG" `
            -DSKSE_SUPPORT_PATCH_SAFETY=ON

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/skyrim --config Release --target SkyrimUpscaler --parallel 2

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimUpscaler-1.7.104-test
          path: build/skyrim/Release/SkyrimUpscaler.dll
          if-no-files-found: error
